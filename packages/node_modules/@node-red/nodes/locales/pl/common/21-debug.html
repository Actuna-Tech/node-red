<script type="text/html" data-help-name="debug">
    <p>Wyświetla wybrane właściwości wiadomości w panelu debug oraz, opcjonalnie, w dzienniku runtime. Domyślnie pokazuje <code>msg.payload</code>, ale można go skonfigurować tak, aby wyświetlał dowolną właściwość, całą wiadomość lub wynik wyrażenia JSONata.</p>
    <h3>Szczegóły</h3>
    <p>Panel debug pokazuje wiadomości w uporządkowanej, strukturalnej formie, co ułatwia zrozumienie ich budowy.</p>
    <p>Obiekty i tablice JavaScript można dowolnie zwijać i rozwijać. Obiekty typu Buffer można wyświetlić jako dane surowe lub, jeśli to możliwe, jako tekst.</p>
    <p>Przy każdej wiadomości panel debug pokazuje czas jej odebrania, węzeł, który ją wysłał, oraz typ wiadomości.
       Kliknięcie identyfikatora węzła źródłowego pokaże ten węzeł w obszarze roboczym.</p>
    <p>Przycisk na węźle włącza lub wyłącza jego wyjście. Zaleca się wyłączanie lub usuwanie węzłów debug, które nie są używane.</p>
    <p>Węzeł można też skonfigurować tak, aby wysyłał wszystkie wiadomości do dziennika runtime lub skróconą wersję (32 znaki) do tekstu statusu pod węzłem debug.</p>
</script>
