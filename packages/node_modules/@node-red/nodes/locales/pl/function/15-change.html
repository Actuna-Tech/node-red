<script type="text/html" data-help-name="change">
    <p>Ustawia, zmienia, usuwa lub przenosi właściwości wiadomości, kontekstu flow lub kontekstu globalnego.</p>
    <p>W węźle można zdefiniować wiele reguł, które są stosowane w kolejności, w jakiej je zdefiniowano.</p>
    <h3>Szczegóły</h3>
    <p>Dostępne operacje:</p>
    <dl class="message-properties">
    <dt>Ustaw (Set)</dt>
    <dd>ustawia właściwość. Wartość może być różnego typu lub może zostać
            pobrana z istniejącej właściwości wiadomości albo kontekstu.</dd>
    <dt>Zmień (Change)</dt>
    <dd>wyszukuje i zamienia fragmenty właściwości. Jeśli włączone są wyrażenia
        regularne, pole „Zamień na” może zawierać grupy przechwytujące, na
        przykład <code>$1</code>. Zamiana zmieni typ właściwości tylko wtedy, gdy
        nastąpi pełne dopasowanie.</dd>
    <dt>Usuń (Delete)</dt>
    <dd>usuwa właściwość.</dd>
    <dt>Przenieś (Move)</dt>
    <dd>przenosi lub zmienia nazwę właściwości.</dd>
    </dl>
    <p>Typ „expression” korzysta z języka zapytań i wyrażeń
    <a href="http://jsonata.org/" target="_new">JSONata</a>.
    </p>
</script>
