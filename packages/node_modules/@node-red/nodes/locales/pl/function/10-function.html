<script type="text/html" data-help-name="function">
    <p>Funkcja JavaScript uruchamiana dla wiadomości odbieranych przez węzeł.</p>
    <p>Wiadomości są przekazywane jako obiekt JavaScript o nazwie <code>msg</code>.</p>
    <p>Zgodnie z konwencją ma on właściwość <code>msg.payload</code> zawierającą
       treść wiadomości.</p>
    <p>Funkcja powinna zwrócić obiekt wiadomości (lub kilka obiektów wiadomości), ale może
       nie zwrócić niczego, aby zatrzymać flow.</p>
    <p>Zakładka <b>Na start</b> zawiera kod uruchamiany za każdym razem, gdy węzeł jest uruchamiany.
        Zakładka <b>Na stop</b> zawiera kod uruchamiany, gdy węzeł jest zatrzymywany.</p>
    <p>Jeśli kod z zakładki Na start zwróci obiekt Promise, węzeł nie zacznie przetwarzać wiadomości,
        dopóki ten Promise nie zostanie rozwiązany.</p>
    <h3>Szczegóły</h3>
    <p>Więcej informacji o pisaniu funkcji można znaleźć w
    <a target="_blank" href="https://nodered.org/docs/writing-functions.html">dokumentacji online</a>.</p>
    <h4>Wysyłanie wiadomości</h4>
    <p>Funkcja może zwrócić wiadomości, które chce przekazać do następnych węzłów
    we flow, albo wywołać <code>node.send(messages)</code>.</p>
    <p>Może zwrócić/wysłać:</p>
    <ul>
      <li>pojedynczy obiekt wiadomości - przekazywany do węzłów podłączonych do pierwszego wyjścia</li>
      <li>tablicę obiektów wiadomości - przekazywane do węzłów podłączonych do odpowiadających im wyjść</li>
    </ul>
    <p>Uwaga: kod z zakładki Na start jest wykonywany podczas inicjalizacji węzłów. Dlatego jeśli w tej zakładce zostanie wywołane <code>node.send</code>, kolejne węzły mogą nie odebrać wiadomości.</p>
    <p>Jeśli którykolwiek element tablicy sam jest tablicą wiadomości, na odpowiadające
          mu wyjście wysyłanych jest wiele wiadomości.</p>
    <p>Jeśli zwrócone zostanie null, samo lub jako element tablicy, żadna
          wiadomość nie jest przekazywana dalej.</p>
    <h4>Logowanie i obsługa błędów</h4>
    <p>Do zapisywania informacji w dzienniku lub zgłaszania błędów dostępne są następujące funkcje:</p>
      <ul>
          <li><code>node.log("Log message")</code></li>
          <li><code>node.warn("Warning")</code></li>
          <li><code>node.error("Error")</code></li>
      </ul>
    <p>Do obsługi błędów można też użyć węzła Catch. Aby go wywołać,
    należy przekazać <code>msg</code> jako drugi argument <code>node.error</code>:</p>
    <pre>node.error("Error",msg);</pre>
    <h4>Dostęp do informacji o węźle</h4>
    <p>Dostęp do informacji o węźle zapewniają następujące właściwości:</p>
    <ul>
        <li><code>node.id</code> - identyfikator węzła</li>
        <li><code>node.name</code> - nazwa węzła</li>
        <li><code>node.outputCount</code> - liczba wyjść węzła</li>
    </ul>
    <h4>Używanie zmiennych środowiskowych</h4>
    <p>Dostęp do zmiennych środowiskowych zapewnia <code>env.get("MY_ENV_VAR")</code>.</p>
</script>
