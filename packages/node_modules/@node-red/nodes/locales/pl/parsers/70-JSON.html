<script type="text/html" data-help-name="json">
    <p>Konwertuje tekst JSON na jego reprezentację w postaci obiektu JavaScript i odwrotnie.</p>
    <h3>Wejścia</h3>
    <dl class="message-properties">
        <dt>payload<span class="property-type">object | string</span></dt>
        <dd>Obiekt JavaScript lub tekst JSON.</dd>
        <dt>schema<span class="property-type">object</span></dt>
        <dd>Opcjonalny obiekt JSON Schema, względem którego walidowany jest payload.
        Właściwość jest usuwana, zanim <code>msg</code> trafi do następnego węzła.</dd>
    </dl>
    <h3>Wyjścia</h3>
    <dl class="message-properties">
        <dt>payload<span class="property-type">object | string</span></dt>
        <dd>
            <ul>
                <li>Jeśli wejściem jest tekst JSON, węzeł próbuje go sparsować do obiektu JavaScript.</li>
                <li>Jeśli wejściem jest obiekt JavaScript, węzeł tworzy tekst JSON. Tekst może być opcjonalnie sformatowany (czytelny, z wcięciami).</li>
            </ul>
        </dd>
        <dt>schemaError<span class="property-type">array</span></dt>
        <dd>Jeśli walidacja JSON Schema się nie powiedzie, węzeł catch otrzyma właściwość <code>schemaError</code>
            zawierającą tablicę błędów.</dd>
    </dl>
    <h3>Szczegóły</h3>
    <p>Domyślnie węzeł działa na <code>msg.payload</code>, ale można go skonfigurować
       tak, aby konwertował dowolną właściwość wiadomości.</p>
    <p>Węzeł można też skonfigurować tak, aby zapewniał określone kodowanie zamiast przełączać
       się między dwoma kierunkami. Można to wykorzystać na przykład z węzłem <code>HTTP In</code>,
       aby mieć pewność, że payload jest sparsowanym obiektem, nawet jeśli przychodzące żądanie
       nie ma poprawnie ustawionego typu zawartości (content-type), przez co węzeł HTTP In
       nie wykonał konwersji.</p>
    <p>Jeśli węzeł jest skonfigurowany tak, by zapewnić kodowanie właściwości jako tekst (String),
       a otrzyma tekst, nie wykonuje dalszych sprawdzeń tej właściwości. Nie sprawdza,
       czy tekst jest poprawnym JSON-em, ani nie sformatuje go ponownie, jeśli wybrano
       opcję formatowania.</p>
    <p>Więcej informacji o JSON Schema można znaleźć w specyfikacji
    <a href="http://json-schema.org/latest/json-schema-validation.html">tutaj</a>.</p>
</script>
